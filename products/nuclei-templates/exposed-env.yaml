id: exposed-env-file

info:
  name: Ochiq .env fayli
  author: secbot
  severity: high
  description: Server web-root'ida .env fayli ochiq bo'lsa, maxfiy kalitlar sizadi.
  tags: exposure,config,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "APP_KEY="
          - "DB_PASSWORD="
          - "SECRET"
        condition: or
      - type: status
        status:
          - 200
